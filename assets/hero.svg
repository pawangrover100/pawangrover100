<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#020617"/>
<stop offset="50%" stop-color="#111827"/>
<stop offset="100%" stop-color="#312e81"/>
</linearGradient>

<linearGradient id="neon" x1="0" x2="1">
<stop offset="0%" stop-color="#00f5ff"/>
<stop offset="50%" stop-color="#8b5cf6"/>
<stop offset="100%" stop-color="#ec4899"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="4" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<rect width="1200" height="360" rx="25" fill="url(#bg)"/>

<!-- animated grid -->

<g opacity=".15" stroke="#00f5ff">

<path d="M0 60H1200">
<animate attributeName="y1" values="60;320;60" dur="7s" repeatCount="indefinite"/>
<animate attributeName="y2" values="60;320;60" dur="7s" repeatCount="indefinite"/>
</path>

<path d="M150 0V360">
<animate attributeName="x1" values="150;1050;150" dur="9s" repeatCount="indefinite"/>
<animate attributeName="x2" values="150;1050;150" dur="9s" repeatCount="indefinite"/>
</path>

</g>

<!-- floating particles -->

<g fill="#00f5ff" filter="url(#glow)">

<circle cx="120" cy="80" r="3">
<animate attributeName="cy" values="80;270;80" dur="4s" repeatCount="indefinite"/>
</circle>

<circle cx="1040" cy="250" r="4">
<animate attributeName="cy" values="250;60;250" dur="5s" repeatCount="indefinite"/>
</circle>

<circle cx="900" cy="90" r="2">
<animate attributeName="cx" values="900;1050;900" dur="3s" repeatCount="indefinite"/>
</circle>

<circle cx="280" cy="290" r="3">
<animate attributeName="cx" values="280;100;280" dur="4s" repeatCount="indefinite"/>
</circle>

</g>

<!-- glowing lines -->

<path d="M80 285 C300 110 450 330 650 150 S950 70 1120 250"
fill="none"
stroke="url(#neon)"
stroke-width="3"
stroke-dasharray="12 12"
filter="url(#glow)">

<animate attributeName="stroke-dashoffset"
values="0;-240"
dur="5s"
repeatCount="indefinite"/>

</path>

<!-- scan line -->

<rect x="0" y="0" width="1200" height="3" fill="#00f5ff" opacity=".8">

<animate attributeName="y"
values="0;357;0"
dur="6s"
repeatCount="indefinite"/>

</rect>

<!-- identity -->

<text x="600" y="145"
text-anchor="middle"
font-family="Arial, sans-serif"
font-size="54"
font-weight="700"
fill="white">

PAWAN GROVER

</text>

<text x="600" y="190"
text-anchor="middle"
font-family="monospace"
font-size="20"
fill="#00f5ff">

SOFTWARE DEVELOPER • MERN • AI

</text>

<text x="600" y="230"
text-anchor="middle"
font-family="monospace"
font-size="15"
fill="#94a3b8">

BUILDING • LEARNING • SHIPPING

</text>

</svg>
