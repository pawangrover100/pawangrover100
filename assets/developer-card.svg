<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0f172a"/>
<stop offset="100%" stop-color="#312e81"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="5" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<rect x="15" y="15" width="470" height="470" rx="30"
fill="url(#card)"
stroke="#8b5cf6"
stroke-width="2"/>

<circle cx="250" cy="135" r="65"
fill="none"
stroke="#00f5ff"
stroke-width="3"
filter="url(#glow)">

<animate attributeName="r"
values="60;72;60"
dur="2.5s"
repeatCount="indefinite"/>

</circle>

<text x="250" y="140"
text-anchor="middle"
font-family="monospace"
font-size="25"
fill="#00f5ff">

</>

</text>

<text x="250" y="245"
text-anchor="middle"
font-family="Arial"
font-size="28"
font-weight="700"
fill="white">

PAWAN GROVER

</text>

<text x="250" y="280"
text-anchor="middle"
font-family="monospace"
font-size="17"
fill="#a78bfa">

MERN STACK DEVELOPER

</text>

<text x="250" y="330"
text-anchor="middle"
font-family="monospace"
font-size="14"
fill="#94a3b8">

React • Node • Express • MongoDB

</text>

<text x="250" y="365"
text-anchor="middle"
font-family="monospace"
font-size="14"
fill="#94a3b8">

AI • REST APIs • UI Engineering

</text>

<circle cx="95" cy="430" r="6" fill="#22c55e">

