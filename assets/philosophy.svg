<svg width="1100" height="190" viewBox="0 0 1100 190" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="p" x1="0" x2="1">
<stop stop-color="#00f5ff"/>
<stop offset=".5" stop-color="#8b5cf6"/>
<stop offset="1" stop-color="#ec4899"/>
</linearGradient>

</defs>

<rect width="1100" height="190" rx="25" fill="#050816"/>

<text x="550" y="75"
text-anchor="middle"
font-family="Arial"
font-size="27"
font-weight="700"
fill="white">

"Build. Break. Learn. Improve."

</text>

<text x="550" y="112"
text-anchor="middle"
font-family="monospace"
font-size="16"
